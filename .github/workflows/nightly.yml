# Nightly: every module of each branch against the newest Odoo commit of the
# same series. Odoo changes internal import methods inside a stable series; this
# catches it the morning after, not at a customer's next upgrade.
#
# Scheduled workflows only run from the default branch, so this one file tests
# every branch listed in the matrix.
name: Nightly against Odoo head

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.series }} on Odoo ${{ matrix.series }} head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: "19.0"
            python: "3.12"
          - series: "18.0"
            python: "3.12"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the modules (${{ matrix.series }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.series }}
          path: addons

      - name: Check out Odoo ${{ matrix.series }} head
        run: git clone --depth 1 --branch "${{ matrix.series }}" https://github.com/odoo/odoo.git odoo

      - name: Check out queue_job (OCA/queue ${{ matrix.series }})
        run: git clone --depth 1 --branch "${{ matrix.series }}" https://github.com/OCA/queue.git oca-queue

      - name: Record the tested commits
        id: commits
        run: |
          odoo_sha=$(git -C odoo rev-parse HEAD)
          echo "odoo_sha=$odoo_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.series }}"
            echo "- Odoo: [\`${odoo_sha:0:10}\`](https://github.com/odoo/odoo/commit/$odoo_sha) ($(git -C odoo log -1 --format=%cI))"
            echo "- Modules: \`$(git -C addons rev-parse --short HEAD)\`"
            echo "- queue_job: \`$(git -C oca-queue rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libldap2-dev libsasl2-dev libpq-dev

      - name: Install Python requirements (Odoo, OCA/queue)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r odoo/requirements.txt
          # OCA generates this from the manifests' external_dependencies
          # (queue_job 19.0 needs openupgradelib).
          python -m pip install -r oca-queue/requirements.txt

      - name: Run the tests
        run: |
          # Only queue_job from OCA/queue: the rest of that repo has dependencies
          # this run does not install.
          mkdir -p oca-addons
          ln -s "$PWD/oca-queue/queue_job" oca-addons/queue_job

          modules=$(for manifest in addons/*/__manifest__.py; do
            basename "$(dirname "$manifest")"
          done | sort | paste -sd, -)
          tags=$(echo "$modules" | sed 's/[^,]*/\/&/g')
          echo "Modules: $modules"

          set -o pipefail
          python odoo/odoo-bin \
            --config=/dev/null \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --addons-path="$PWD/odoo/addons,$PWD/addons,$PWD/oca-addons" \
            --data-dir="$RUNNER_TEMP/odoo-data" \
            -d nightly \
            -i "$modules" \
            --test-tags "$tags" \
            --stop-after-init --no-http \
            --log-level=info \
            2>&1 | tee odoo.log

      - name: Check the result
        if: always()
        run: |
          result=$(grep -E "odoo.tests.result: [0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests" odoo.log | tail -1 || true)
          echo "- Result: ${result:-no test result line (install failed?)}" >> "$GITHUB_STEP_SUMMARY"
          echo "$result"
          grep -E "^(FAIL|ERROR): |Traceback|CRITICAL" odoo.log | head -50 || true
          case "$result" in
            *" 0 failed, 0 error(s) of "*) exit 0 ;;
            *) echo "::error::${{ matrix.series }} fails on Odoo ${{ steps.commits.outputs.odoo_sha }}"; exit 1 ;;
          esac

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-${{ matrix.series }}.log
          path: odoo.log
          retention-days: 14
